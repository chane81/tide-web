packages:
  - "apps/*"
  - "packages/config/*"
  - "packages/shared/*"

# 외부 의존성 버전은 여기서만 정한다. package.json에는 "catalog:"로 적는다.
catalog:
  "@rsbuild/plugin-react": 2.1.1
  "@rslib/core": 1.0.7
  "@tailwindcss/postcss": 4.3.5
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.10
  "@tide-design/components": 0.15.0
  "@tide-design/icons": 0.15.0
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  jsdom: 31.0.1
  next: 16.4.6
  oxfmt: 0.78.0
  oxlint: 1.93.0
  postcss: 8.5.33
  react: 19.3.1
  react-dom: 19.3.1
  react-is: 19.3.1
  recharts: 3.10.1
  tailwindcss: 4.3.5
  turbo: 2.11.11
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0

# pnpm add 시 catalog에 없는 버전을 막는다.
catalogMode: strict

minimumReleaseAgeExclude:
  - "@tide-design/components@0.15.0"
  - "@tide-design/foundation@0.15.0"
  - "@tide-design/icons@0.15.0"
  - jsdom@31.0.1
  - postcss@8.5.33
